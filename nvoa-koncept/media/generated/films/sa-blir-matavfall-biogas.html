<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b2a3b;color:#fff;font-family:system-ui,'Segoe UI',Roboto,sans-serif}
.film{display:flex;flex-direction:column;height:100%}
.stage{position:relative;flex:1 1 auto;min-height:0;background:#bfe3f5}
.stage>svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:0;
  background:rgba(11,42,59,.78);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.big svg{width:34px;height:34px;margin-left:5px}
.big[hidden]{display:none}
.cap{margin:0;padding:10px 14px;min-height:3.7em;font-size:15px;line-height:1.4;background:#0b2a3b;color:#fff;display:flex;align-items:center}
.bar{display:flex;align-items:center;gap:12px;padding:6px 12px 10px;background:#0b2a3b}
.bar button{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid #f2a03d;background:transparent;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0}
.bar button svg{width:18px;height:18px}
.bar input{flex:1;min-width:0;height:44px;margin:0;accent-color:#f2a03d;cursor:pointer}
.tm{flex:none;font-size:13px;font-variant-numeric:tabular-nums;color:#d6eefa;min-width:5.6em;text-align:right}
:focus-visible{outline:3px solid #f2a03d;outline-offset:3px}
body.bare .cap,body.bare .bar,body.bare .big{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:480px){.tm{display:none}.cap{font-size:14px}}

th="10" stroke-linecap="round" stroke-linejoin="round" /><polyline points="500,306 500,374 735,374 735,392" fill="none" stroke="#0b3c5d" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" /><polyline points="500,306 500,374 735,374 735,392" fill="none" stroke="#c8b89a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><rect x="604" y="262" width="28" height="38" rx="4" fill="#f2a03d" /><rect x="610" y="268" width="16" height="10" rx="2" fill="#12303f" /><circle cx="618" cy="258" r="8" fill="#d9662f" /><g id="gasdots"></g><g id="digdots"></g><g transform="translate(650 408) scale(0.01)" id="sp0"><path d="M0 0 V-30" fill="none" stroke="#2f7d4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -14 q-14 -4 -16 -18 q14 2 16 18Z M0 -22 q14 -4 16 -18 q-14 2 -16 18Z" fill="#5aa469" /><path d="M0 -30 q-6 -10 0 -20 q6 10 0 20Z" fill="#a6d39a" /></g><g transform="translate(690 408) scale(0.01)" id="sp1"><path d="M0 0 V-30" fill="none" stroke="#2f7d4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -14 q-14 -4 -16 -18 q14 2 16 18Z M0 -22 q14 -4 16 -18 q-14 2 -16 18Z" fill="#5aa469" /><path d="M0 -30 q-6 -10 0 -20 q6 10 0 20Z" fill="#a6d39a" /></g><g transform="translate(730 408) scale(0.01)" id="sp2"><path d="M0 0 V-30" fill="none" stroke="#2f7d4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -14 q-14 -4 -16 -18 q14 2 16 18Z M0 -22 q14 -4 16 -18 q-14 2 -16 18Z" fill="#5aa469" /><path d="M0 -30 q-6 -10 0 -20 q6 10 0 20Z" fill="#a6d39a" /></g><g transform="translate(770 408) scale(0.01)" id="sp3"><path d="M0 0 V-30" fill="none" stroke="#2f7d4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -14 q-14 -4 -16 -18 q14 2 16 18Z M0 -22 q14 -4 16 -18 q-14 2 -16 18Z" fill="#5aa469" /><path d="M0 -30 q-6 -10 0 -20 q6 10 0 20Z" fill="#a6d39a" /></g><g id="trk"></g><g transform="translate(-200 338)" id="truck"><g transform="translate(0 0) <script>
var H={TAU:Math.PI*2,NS:'http://www.w3.org/2000/svg',
 clamp:function(x,a,b){return Math.max(a,Math.min(b,x))},
 seg:function(t,a,b){return H.clamp((t-a)/(b-a),0,1)},
 ease:function(x){return x*x*(3-2*x)},
 mix:function(a,b,k){return a+(b-a)*k},
 ph:function(t,k,o){var v=(t*k/FILM.D+(o||0))%1;return v<0?v+1:v},
 pulse:function(t,a,b,f){return H.clamp(Math.min((t-a)/f,(b-t)/f),0,1)},
 el:function(n,a,p){var e=document.createElementNS(H.NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e},
 rgb:function(c){c=c.replace('#','');return [parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)]},
 col:function(c1,c2,k){var a=H.rgb(c1),b=H.rgb(c2);return 'rgb('+Math.round(H.mix(a[0],b[0],k))+','+Math.round(H.mix(a[1],b[1],k))+','+Math.round(H.mix(a[2],b[2],k))+')'},
 $:function(i){return document.getElementById(i)},
 tf:function(id,v){var e=document.getElementById(id);if(e)e.setAttribute('transform',v)},
 op:function(id,v){var e=document.getElementById(id);if(e)e.setAttribute('opacity',v)},
 along:function(pts){var cum=[0];for(var i=1;i<pts.length;i++){cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]))}
  return {cum:cum,L:cum[cum.length-1],at:function(d){d=Math.max(0,Math.min(this.L,d));var i=1;while(i<cum.length-1&&cum[i]<d)i++;
   var s=(d-cum[i-1])/((cum[i]-cum[i-1])||1);return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*s,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*s]}}}
};
</script>
<script>
FILM={id:'biogas',D:26,still:13,
caps:[[0,5,'Matavfallet läggs i en särskild påse i köket.'],
[5,11,'Sopbilen hämtar påsarna och kör dem till en behandlingsanläggning.'],
[11,17,'I en sluten tank rörs matavfallet om utan syre. Bakterier bryter ner det.'],
[17,22,'Då bildas biogas. Den kan bli bränsle till bussar och andra fordon.'],
[22,26,'Det som blir kvar kan användas som biogödsel på åkermark.']],
init:function(){
 this.GAS=H.along([[485, 128], [485, 100], [618, 100], [618, 262]]);this.DIG=H.along([[500, 306], [500, 374], [735, 374], [735, 392]]);
 var s=H.$('scraps');this.sc=[];for(var i=0;i<3;i++)this.sc.push(H.el('circle',{r:7,fill:['#f2c744','#d9662f','#9bcf6a'][i]},s));
 var m=H.$('mix');this.mx=[];for(var i=0;i<26;i++)this.mx.push(H.el('circle',{r:3.2,fill:['#9bcf6a','#f2c744','#d9662f','#c8a46a'][i%4]},m));
 var g=H.$('gasdots');this.gd=[];for(var i=0;i<12;i++)this.gd.push(H.el('circle',{r:4.5,fill:'#fff3c4',stroke:'#e0a82e','stroke-width':1.5},g));
 var q=H.$('digdots');this.dd=[];for(var i=0;i<10;i++)this.dd.push(H.el('circle',{r:4.5,fill:'#8d6e4f',stroke:'#fff','stroke-width':1},q));
},
draw:function(t){
 var D=FILM.D,K=H.TAU;
 H.tf('cl0','translate('+(((260+900*t/D)%900)-100).toFixed(1)+' 50)');H.tf('cl1','translate('+(((600+900*t/D)%900)-100).toFixed(1)+' 90)');
 // påsen och locket
 var lidOpen=H.pulse(t,.4,3.6,.5);H.tf('lid','translate(86 216) rotate('+(-lidOpen*70).toFixed(1)+' 0 0)');
 for(var i=0;i<3;i++){var a=.9+i*.8,f=H.seg(t,a,a+1.2),y=170+f*(i?66:68);var c=this.sc[i];
  c.setAttribute('cx',(104+i*14).toFixed(1));c.setAttribute('cy',y.toFixed(1));c.setAttribute('opacity',(f>0&&f<.98)?1:0)}
 H.tf('bag','translate(186 250) scale('+(1+.0*0)+')');H.op('bag',H.pulse(t,3,5.2,.5)>0?1:1);
 // sopbil: åker in 5-10, tippar 10-11.2
 var tf=H.ease(H.seg(t,4.6,9.8)),tx=-200+tf*(565);
 H.tf('truck','translate('+tx.toFixed(1)+' 338)');H.op('truck',H.pulse(t,4.4,11.4,.7));
 // omrörning i tanken
 for(var i=0;i<26;i++){var a=K*(t*2/D*3)+i*.6,r=14+(i%5)*7,x=486+Math.cos(a+i)*r*1.4,y=235+Math.sin(a+i)*r*.45,c=this.mx[i];
  c.setAttribute('cx',x.toFixed(1));c.setAttribute('cy',y.toFixed(1));c.setAttribute('opacity',H.mix(.35,1,H.pulse(t,10.5,22,1.5)).toFixed(2))}
 // gas
 var ge=H.pulse(t,12,22.5,1.2);
 for(var i=0;i<12;i++){var p=this.GAS.at(H.ph(t,3,i/12)*this.GAS.L),c=this.gd[i];c.setAttribute('cx',p[0].toFixed(1));c.setAttribute('cy',p[1].toFixed(1));c.setAttribute('opacity',ge.toFixed(2))}
 // buss
 var bf=H.ease(H.seg(t,18.4,22.8)),bx=690+bf*320;H.tf('bus','translate('+bx.toFixed(1)+' 340)');H.op('bus',H.pulse(t,14.2,23.2,.8));
 // biogödsel
 var de=H.pulse(t,19,25,.8);
 for(var i=0;i<10;i++){var p=this.DIG.at(H.ph(t,3,i/10)*this.DIG.L),c=this.dd[i];c.setAttribute('cx',p[0].toFixed(1));c.setAttribute('cy',p[1].toFixed(1));c.setAttribute('opacity',de.toFixed(2))}
 for(var i=0;i<4;i++){var s=H.ease(H.seg(t,21+i*.5,24.8))*1.0,o=1-H.seg(t,25.2,26);H.tf('sp'+i,'translate('+[650,690,730,770][i]+' 408) scale('+Math.max(.01,s).toFixed(3)+')');H.op('sp'+i,s>0.02?o:0)}
}};
</script>
<script>
(function(){
var F=window.FILM,D=F.D,$=H.$;
var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var bare=/[?&]bare/.test(location.search);
if(bare){document.body.classList.add('bare');$('scene').setAttribute('preserveAspectRatio','xMidYMid slice');}
var t=F.still,playing=false,last=0,raf=0;
var mt=/[?&]t=([\d.]+)/.exec(location.search);if(mt)t=parseFloat(mt[1])%D;
var PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>';
var PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>';
var pp=$('pp'),seek=$('seek'),big=$('big'),cap=$('cap'),tm=$('tm');
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}
function render(){
 F.draw(t);
 var txt='';for(var i=0;i<F.caps.length;i++){if(t>=F.caps[i][0]&&t<F.caps[i][1]){txt=F.caps[i][2];break}}
 if(cap.textContent!==txt)cap.textContent=txt;
 seek.value=Math.round(t/D*1000);seek.setAttribute('aria-valuetext',fmt(t)+' av '+fmt(D));
 tm.textContent=fmt(t)+' / '+fmt(D);
}
function ui(){
 pp.innerHTML=playing?PAUSE:PLAY;pp.setAttribute('aria-label',playing?'Pausa filmen':'Spela filmen');
 big.hidden=playing;big.innerHTML=PLAY;
 try{parent.postMessage({type:'nvoa-scene',id:F.id,playing:playing},'*')}catch(e){}
}
function tick(ts){if(!playing)return;var dt=Math.min(.1,(ts-last)/1000);last=ts;t=(t+dt)%D;render();raf=requestAnimationFrame(tick)}
function play(){if(playing)return;playing=true;last=performance.now();raf=requestAnimationFrame(tick);ui()}
function pause(){if(!playing)return;playing=false;cancelAnimationFrame(raf);ui()}
pp.addEventListener('click',function(){playing?pause():play()});
big.addEventListener('click',play);
seek.addEventListener('input',function(){t=(seek.value/1000)*D;if(t>=D)t=D-.001;render()});
window.addEventListener('message',function(e){var m=e.data;if(!m||!m.cmd)return;
 if(m.cmd==='play')play();else if(m.cmd==='pause')pause();else if(m.cmd==='toggle')playing?pause():play();else if(m.cmd==='query')ui()});
document.addEventListener('keydown',function(e){if(e.key===' '&&e.target===document.body){e.preventDefault();playing?pause():play()}});
if(F.init)F.init();
render();ui();
if(bare&&!rm)play();
})();
</script>
